<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="glassGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="glassGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded plate -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Main Sheet / Glass Plate Representation -->
  <!-- Base Sheet Layer -->
  <rect x="96" y="106" width="320" height="300" rx="20" fill="url(#glassGrad1)" stroke="#ffffff" stroke-width="6" stroke-opacity="0.6"/>

  <!-- Internal Cut Sections (Plano de corte visual) -->
  <!-- Cut Piece A -->
  <rect x="116" y="126" width="170" height="150" rx="12" fill="url(#glassGrad2)" stroke="#a5f3fc" stroke-width="4" stroke-opacity="0.8"/>
  <text x="201" y="210" fill="#ffffff" font-size="28" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle" letter-spacing="1">100×80</text>

  <!-- Cut Piece B -->
  <rect x="296" y="126" width="100" height="150" rx="12" fill="#3b82f6" fill-opacity="0.4" stroke="#93c5fd" stroke-width="4" stroke-opacity="0.8"/>
  <text x="346" y="210" fill="#ffffff" font-size="20" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">50×80</text>

  <!-- Cut Piece C (bottom) -->
  <rect x="116" y="286" width="280" height="100" rx="12" fill="#0ea5e9" fill-opacity="0.3" stroke="#7dd3fc" stroke-width="4" stroke-opacity="0.8"/>
  <text x="256" y="345" fill="#ffffff" font-size="26" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle" letter-spacing="1">150×50</text>

  <!-- Laser/Cutter guides -->
  <line x1="291" y1="116" x2="291" y2="286" stroke="#f43f5e" stroke-width="4" stroke-dasharray="8 6"/>
  <line x1="106" y1="281" x2="406" y2="281" stroke="#f43f5e" stroke-width="4" stroke-dasharray="8 6"/>

  <!-- Cutter diamond tool icon top right -->
  <g transform="translate(370, 75)">
    <circle cx="25" cy="25" r="32" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
    <path d="M15 35 L25 15 L35 35 Z" fill="#38bdf8"/>
    <circle cx="25" cy="35" r="4" fill="#f43f5e"/>
  </g>
</svg>
